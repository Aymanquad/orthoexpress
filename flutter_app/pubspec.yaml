name: orthoexpress_app
description: OrthoExpress — Orthopedic Walk-in Clinic mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  intl: ^0.20.2
  http: ^1.6.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/
    - assets/images/
    - assets/images/home/
    - assets/images/about/
    - assets/images/services/
    - assets/images/blogs/
    - assets/images/shop/
    - assets/images/workers-comp/
    - assets/images/los-angeles.avif
    - assets/images/london.jpg
    - assets/images/berlin.webp
    - assets/images/knee-injury.webp
    - assets/images/recovery-after-orthopedicsurgery.jpg
    - assets/images/joint-img.jpg
